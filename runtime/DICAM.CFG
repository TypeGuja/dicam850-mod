# DiCam 850 - runtime config (SPHOST_rtcfg8). Edit on the card, reboot the camera.
# Lines count only if they start with "mode="; a leading "#" turns a line off.
#
# mode=WIDTH,FPS,BITRATE,CROP[,MAXISO]
#   WIDTH,FPS = which recording slot (see the list below)
#   BITRATE   = Mbit/s 10..160, 0 = keep. Above ~80 needs a fast (V30/U3) card.
#   CROP      = aspect x100 (235 = 2.35:1, 185 = 1.85:1) or a height (e.g. 1632),
#               0 = keep. The frame is only cropped, never stretched.
#   MAXISO    = optional video ISO ceiling 100..6400, 0/absent = no limit.
#               The exposure table is PER FPS, so modes with the same FPS share
#               one ISO limit. Useful mainly on 30 fps; on 60/120/240 the camera
#               has only gain to brighten the dark, so a low ISO just darkens it.
#
# Example in use: 4K30 cinemascope at 90 Mbit, ISO capped at 800.
mode=3840,30,90,235,800
#
# All slots (uncomment and set what you need):
# mode=3840,60,75,0        # 4K 60
# mode=3840,30,60,0        # 4K 30
# mode=2704,60,60,0        # 2.7K 60
# mode=2704,30,48,0        # 2.7K 30
# mode=1920,120,40,0       # 1080p 120
# mode=1920,60,40,0        # 1080p 60
# mode=1920,30,30,0        # 1080p 30
# mode=1280,240,38,0       # 720p 240
# mode=1280,120,38,0       # 720p 120
# mode=1280,60,26,0        # 720p 60

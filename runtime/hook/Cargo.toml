[package]
name = "dicam_hook"
version = "0.2.0"
edition = "2021"
description = "DiCam 850 runtime SD-card config hook (linked at the firmware code gap)"

[[bin]]
name = "dicam_hook"
path = "src/main.rs"
test = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
panic = "abort"
